
name: Shandaar Momo CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Unit Tests
        run: python -m unittest discover -v

      - name: Test Homepage
        run: |
          python -c "from app import app; client = app.test_client(); response = client.get('/'); assert response.status_code == 200; print('Homepage test passed!')"

      - name: Pipeline Success
        run: echo "Shandaar Momo CI Pipeline Completed!"
